<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link href="./styles.css" rel="stylesheet">
</head>
<body>
    <div class="registration-form-page">

        <div class="left-section">
            <div class="website-banner">
                <img src="./images/odin-logo.png" alt="odin project logo">
                <h1>ODIN</h1>
            </div>
            <div class="bg-image-credits">
                <p>Plant Photo by 
                    <a href=
                    "https://unsplash.com/@haliewestphoto?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">
                    Halie West</a> on 
                    <a href=
                    "https://unsplash.com/photos/green-leaf-plant-in-close-up-photography-25xggax4bSA?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">
                    Unsplash</a>
                </p> 
            </div>
        </div>

        <div class="right-section">
            <div class="quote-section">
                <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Neque ipsum rerum voluptas fugit doloremque incidunt expedita consectetur vel. Nobis harum ipsa itaque.</p>
                <p>You <em>know</em> you want to.</p>
            </div>
            <div class="form-section">
                <div class="form-encourage">
                    <p>Let's do this!</p>
                </div>
                <form>
                    <div class="form-left">
                        <label for="first-name">First Name</label>
                        <input id="first-name" type="text" name="first-name">
                        
                        <label for="email">Email</label>
                        <input id="email" type="email" name="email">
                        
                        <label for="password">Password</label>
                        <input id="password" type="password" name="password">
                    </div>
                    <div class="form-right">
                        <label for="last-name">Last Name</label>
                        <input id="last-name" type="text" name="last-name">
                        
                        <label for="phone">Phone Number</label>
                        <input id="phone" type="tel" name="phone">
                        
                        <label for="password">Confirm Password</label>
                        <input id="password" type="password" name="password">
                    </div>
                </form>
            </div>
            <div class="submission-section"></div>
        </div>
    </div>
</body>
</html>
